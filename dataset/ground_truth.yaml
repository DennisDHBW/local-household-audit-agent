# Ground Truth: 14-Fragen-Katalog (concept.md, Abschnitt 11.2), eingebaute Fehler und erwartete Prüfurteile.
# Struktur siehe audit_agent.corpus.models. Beträge in EUR brutto, Preise in ct/kWh, falls nicht anders angegeben.
# Dateipfade relativ zu dataset/, Seiten ab 1.
# expected_tools_v2: erwartete Werkzeuge im Werkzeugsatz v2 (M8), wo sie von expected_tools abweichen (ISS-118).

questions:
  - id: S1
    category: standard
    question: Welche Kündigungsfrist gilt für den Gasvertrag und bis wann läuft die Erstlaufzeit?
    expected_answer: 6 Wochen zum Ende der Erstlaufzeit am 31.12.2025, danach 1 Monat Frist (unbefristet).
    facts:
      - { label: Kündigungsfrist in der Erstlaufzeit, value: "6 Wochen" }
      - { label: Ende der Erstlaufzeit, value: "31.12.2025" }
      - { label: Kündigungsfrist danach, value: "1 Monat" }
    sources:
      - { file: 02_gas_neckarenergie/07_Gas_Liefervertrag_NeckarEnergie_2024.pdf, page: 1 }
      - { file: 02_gas_neckarenergie/09_Gas_Preisanpassung_NeckarEnergie_2026.pdf, page: 1 }
    expected_tools: [search]
    tests: Text-Retrieval, Hierarchie-Boost

  - id: S2
    category: standard
    question: Welcher Arbeits- und Grundpreis gelten laut Stromvertrag?
    expected_answer: Arbeitspreis 34,80 ct/kWh und Grundpreis 11,50 EUR/Monat (jeweils brutto).
    facts:
      - { label: Arbeitspreis brutto, value: 34.80, unit: ct/kWh }
      - { label: Grundpreis brutto, value: 11.50, unit: EUR/Monat }
    sources:
      - { file: 01_electricity_suedvolt/01_Strom_Vertragsbestaetigung_SuedVolt_2024.pdf, page: 1 }
    expected_tools: [search]
    expected_tools_v2: [get_facts]
    tests: search (Tabellen), Metadatenfilter

  - id: S3
    category: standard
    question: Wie hoch war der Wasserverbrauch 2025 laut Zählerständen?
    expected_answer: 74 m³ (Zählerstand 386 m³ am Jahresende minus 312 m³ am Jahresanfang).
    facts:
      - { label: Wasserverbrauch 2025, value: 74, unit: m³, tolerance: 0 }
    sources:
      - { file: 03_water_stadtwerke_mosbach/15_Wasser_Jahresbescheid_2025_SWM.pdf, page: 1 }
    expected_tools: [search]
    expected_tools_v2: [get_facts]
    tests: Tabellenzeilen, richtiges Jahr

  - id: S4
    category: standard
    question: Wie hoch war der Stromverbrauch 2022 und 2023?
    expected_answer: 3.480 kWh (2022) und 3.390 kWh (2023); die Werte stehen nur im Diagramm.
    facts:
      - { label: Stromverbrauch 2022, value: 3480, unit: kWh, tolerance: 0 }
      - { label: Stromverbrauch 2023, value: 3390, unit: kWh, tolerance: 0 }
    sources:
      - { file: 01_electricity_suedvolt/04_Strom_Jahresabrechnung_2024_SuedVolt.pdf, page: 2 }
    expected_tools: [search_images]
    expected_tools_v2: [search]
    tests: search_images, Vision-Caption

  - id: S5
    category: standard
    question: Stimmt die Stromabrechnung 2024 mit den Vertragspreisen überein?
    expected_answer: Ja, der Rechnungsbetrag von 1.189,00 EUR ist mit den Vertragspreisen und dem Neukundenbonus konsistent.
    facts:
      - { label: Rechnungsbetrag 2024, value: 1189.00, unit: EUR }
      - { label: Abrechnung korrekt, value: "ja" }
    sources:
      - { file: 01_electricity_suedvolt/01_Strom_Vertragsbestaetigung_SuedVolt_2024.pdf, page: 1 }
      - { file: 01_electricity_suedvolt/04_Strom_Jahresabrechnung_2024_SuedVolt.pdf, page: 1 }
    expected_tools: [search, calculate]
    expected_tools_v2: [check_bill]
    tests: ReAct, calculate, keine Fehlalarme

  - id: G1
    category: edge_case
    question: Wurde in der Stromabrechnung 2025 der angekündigte neue Arbeitspreis angewendet?
    expected_answer: Nein. Angekündigt waren 38,20 ct/kWh, abgerechnet wurden 39,50 ct/kWh; bei 3.100 kWh sind das 40,30 EUR zu viel.
    facts:
      - { label: Angekündigter Arbeitspreis, value: 38.20, unit: ct/kWh }
      - { label: Abgerechneter Arbeitspreis, value: 39.50, unit: ct/kWh }
      - { label: Zu viel berechnet, value: 40.30, unit: EUR }
    sources:
      - { file: 01_electricity_suedvolt/03_Strom_Preisanpassung_SuedVolt_2025.pdf, page: 1 }
      - { file: 01_electricity_suedvolt/06_Strom_Jahresabrechnung_2025_SuedVolt.pdf, page: 1 }
    expected_tools: [search, calculate]
    expected_tools_v2: [check_bill]
    planted_error: E1
    tests: Multi-Hop über zwei Dokumente, Fehlererkennung

  - id: G2
    category: edge_case
    question: Ist mein Anteil an den Betriebskosten 2025 korrekt berechnet?
    expected_answer: Ja. 78 m² von 312 m² sind 25 %, 25 % von 7.320,00 EUR sind 1.830,00 EUR; abzüglich 1.920,00 EUR Vorauszahlungen ergibt sich ein Guthaben von 90,00 EUR.
    facts:
      - { label: Wohnflächenanteil, value: 25, unit: "%", tolerance: 0 }
      - { label: Anteil Betriebskosten 2025, value: 1830.00, unit: EUR }
      - { label: Guthaben, value: 90.00, unit: EUR }
    sources:
      - { file: 04_housing_utilities_contractors/16_Mietvertrag_Hauptstrasse42_2023.pdf, page: 1 }
      - { file: 04_housing_utilities_contractors/19_Nebenkostenabrechnung_2025_Hausverwaltung.pdf, page: 1 }
    expected_tools: [search, calculate]
    expected_tools_v2: [check_bill]
    tests: Mietvertrag gegen Abrechnung, keine Fehlalarme

  - id: G3
    category: edge_case
    question: Ist die Gasabrechnung 2026 korrekt?
    expected_answer: Nein. Abgerechnet wurde mit z-Zahl 1,0000 statt 0,9560 (wie 2024 und 2025); richtig wären 1.060 m³ × 0,9560 × 11,150 kWh/m³ = 11.299 kWh statt 11.819 kWh, das sind 51,74 EUR zu viel.
    facts:
      - { label: Korrekte z-Zahl, value: 0.9560, tolerance: 0 }
      - { label: Korrekte Energiemenge, value: 11299, unit: kWh, tolerance: 1 }
      - { label: Zu viel berechnet, value: 51.74, unit: EUR }
    sources:
      - { file: 02_gas_neckarenergie/29_Gas_Jahresabrechnung_2026_NeckarEnergie.pdf, page: 1 }
      - { file: 02_gas_neckarenergie/10_Gas_Jahresabrechnung_2025_NeckarEnergie.pdf, page: 1 }
    expected_tools: [search, calculate]
    expected_tools_v2: [check_bill]
    planted_error: E2
    tests: Fehlererkennung durch Vergleich mit dem Vorjahr, Rechnen mit Umrechnungsfaktoren

  - id: G4
    category: edge_case
    question: Ist mein Anteil an den Betriebskosten 2026 korrekt berechnet?
    expected_answer: Nein. Abgerechnet wurden 82 m² (26,28 %) statt der im Mietvertrag vereinbarten 78 m² (25 %); richtig wären 25 % von 7.470,00 EUR = 1.867,50 EUR statt 1.963,28 EUR.
    facts:
      - { label: Wohnfläche laut Mietvertrag, value: 78, unit: m², tolerance: 0 }
      - { label: Abgerechnete Wohnfläche, value: 82, unit: m², tolerance: 0 }
      - { label: Korrekter Anteil, value: 1867.50, unit: EUR }
    sources:
      - { file: 04_housing_utilities_contractors/16_Mietvertrag_Hauptstrasse42_2023.pdf, page: 1 }
      - { file: 04_housing_utilities_contractors/30_Nebenkostenabrechnung_2026_Hausverwaltung.pdf, page: 1 }
    expected_tools: [search, calculate]
    expected_tools_v2: [check_bill]
    planted_error: E3
    tests: Mietvertrag gegen Abrechnung, Fehlererkennung

  - id: N1
    category: negative
    question: Wie hoch war meine Stromrechnung 2023?
    expected_answer: Liegt nicht vor, da die Belieferung erst am 01.01.2024 begann; nur der Verbrauch 2023 (3.390 kWh) ist aus dem Diagramm bekannt.
    is_answerable: false
    expected_tools: [list_documents]
    tests: keine erfundene Zahl

  - id: N2
    category: negative
    question: Welchen Grundpreis zahle ich für Fernwärme?
    expected_answer: Es gibt keinen Fernwärmevertrag; die Wohnung wird mit einer Gasetagenheizung beheizt.
    is_answerable: false
    expected_tools: [list_documents]
    tests: Ablenker nicht verwechseln

  - id: Z1
    category: additional
    question: Passt der abgerechnete Gasverbrauch 2025 zu den Zählerständen?
    expected_answer: Ja. 9.320 − 8.120 = 1.200 m³; 1.200 m³ × 0,9560 × 11,150 kWh/m³ ergeben 12.791 kWh.
    facts:
      - { label: Volumen, value: 1200, unit: m³, tolerance: 0 }
      - { label: z-Zahl, value: 0.9560, tolerance: 0 }
      - { label: Energiemenge, value: 12791, unit: kWh, tolerance: 1 }
    sources:
      - { file: 02_gas_neckarenergie/10_Gas_Jahresabrechnung_2025_NeckarEnergie.pdf, page: 1 }
    expected_tools: [search, calculate]
    expected_tools_v2: [check_bill]
    tests: Rechnen mit Umrechnungsfaktoren

  - id: Z2
    category: additional
    question: Wie hoch ist mein aktueller monatlicher Stromabschlag?
    expected_answer: 120,00 EUR ab 15.02.2026, nicht die früheren 105,00 oder 115,00 EUR.
    facts:
      - { label: Aktueller Abschlag, value: 120.00, unit: EUR/Monat }
    sources:
      - { file: 01_electricity_suedvolt/06_Strom_Jahresabrechnung_2025_SuedVolt.pdf, page: 1 }
    expected_tools: [list_documents, search]
    expected_tools_v2: [get_facts]
    tests: neuestes Dokument wählen

  - id: Z3
    category: additional
    question: Mit welcher Frist kann ich meinen Stromvertrag kündigen?
    expected_answer: Nach der Erstlaufzeit (bis 31.12.2024) jederzeit mit 1 Monat Frist; die Fristen von Internet- und Mobilfunkvertrag gehören nicht dazu.
    facts:
      - { label: Kündigungsfrist Strom, value: "1 Monat" }
    sources:
      - { file: 01_electricity_suedvolt/01_Strom_Vertragsbestaetigung_SuedVolt_2024.pdf, page: 1 }
    expected_tools: [search]
    tests: Ablenker (Distractor Rate)

  # --- M8 (ADR-0019): Heizstrom (Nachtspeicher, HT/NT), Wasser 2026, Übersichten und Grafiken ---
  - id: H1
    category: standard
    question: Welche HT- und NT-Arbeitspreise gelten 2025 für den Heizstrom?
    expected_answer: Ab 01.01.2025 gelten 33,50 ct/kWh im Hochtarif (HT) und 24,10 ct/kWh im Niedertarif (NT), jeweils brutto.
    facts:
      - { label: Arbeitspreis HT 2025, value: 33.50, unit: ct/kWh }
      - { label: Arbeitspreis NT 2025, value: 24.10, unit: ct/kWh }
    sources:
      - { file: 01_electricity_suedvolt/33_Heizstrom_Preisanpassung_SuedVolt_2025.pdf, page: 1 }
    expected_tools: [get_facts]
    tests: Gültigkeit nach Datum, Heizstrom statt Lichtstrom, zwei Zonen

  - id: H2
    category: edge_case
    question: Ist die Heizstromabrechnung 2025 korrekt?
    expected_answer: Nein. Laut Zählerständen (12.680 auf 16.100 kWh) wurden im NT 3.420 kWh verbraucht, abgerechnet sind 3.920 kWh; das sind 500 kWh und 120,50 EUR zu viel.
    facts:
      - { label: NT-Verbrauch laut Zählerständen, value: 3420, unit: kWh, tolerance: 0 }
      - { label: Abgerechneter NT-Verbrauch, value: 3920, unit: kWh, tolerance: 0 }
      - { label: Zu viel berechnet, value: 120.50, unit: EUR }
    sources:
      - { file: 01_electricity_suedvolt/34_Heizstrom_Jahresabrechnung_2025_SuedVolt.pdf, page: 1 }
    expected_tools: [check_bill]
    planted_error: E4
    tests: Zählerstände gegen abgerechnete Menge, Zweitarifzähler

  - id: H3
    category: additional
    question: Stimmt die Heizstromabrechnung 2024?
    expected_answer: Ja. Preise, Zählerstände (HT 620 kWh, NT 3.180 kWh) und Abschläge passen, der Rechnungsbetrag von 1.016,90 EUR stimmt.
    facts:
      - { label: Rechnungsbetrag 2024, value: 1016.90, unit: EUR }
      - { label: Abrechnung korrekt, value: "ja" }
    sources:
      - { file: 01_electricity_suedvolt/31_Heizstrom_Vertragsbestaetigung_SuedVolt_2024.pdf, page: 1 }
      - { file: 01_electricity_suedvolt/32_Heizstrom_Jahresabrechnung_2024_SuedVolt.pdf, page: 1 }
    expected_tools: [check_bill]
    tests: keine Fehlalarme

  - id: W1
    category: edge_case
    question: Ist der Wasserbescheid 2026 korrekt?
    expected_answer: Nein. Seit Q1/2026 beträgt die Vorauszahlung 125,00 EUR je Quartal, gezahlt wurden also 500,00 EUR; angerechnet sind nur 4 × 120,00 = 480,00 EUR. Das Guthaben ist um 20,00 EUR zu niedrig.
    facts:
      - { label: Geleistete Vorauszahlungen, value: 500.00, unit: EUR }
      - { label: Angerechnete Vorauszahlungen, value: 480.00, unit: EUR }
      - { label: Zu wenig angerechnet, value: 20.00, unit: EUR }
    sources:
      - { file: 03_water_stadtwerke_mosbach/35_Wasser_Jahresbescheid_2026_SWM.pdf, page: 1 }
      - { file: 03_water_stadtwerke_mosbach/14_Wasser_Gebuehrenanpassung_2026_SWM.pdf, page: 1 }
    expected_tools: [check_bill]
    planted_error: E5
    tests: Abschläge gegen Gebührenmitteilung, Fehler ohne Preisabweichung

  - id: V1
    category: visual
    question: Erstelle eine Grafik zum Stromverbrauch 2024 und 2025, getrennt nach Licht- und Heizstrom.
    expected_answer: Lichtstrom 3.250 kWh (2024) und 3.100 kWh (2025); Heizstrom HT 620 und 580 kWh, NT 3.180 und 3.420 kWh laut Zählerständen.
    facts:
      - { label: Lichtstrom 2024, value: 3250, unit: kWh, tolerance: 0 }
      - { label: Lichtstrom 2025, value: 3100, unit: kWh, tolerance: 0 }
      - { label: Heizstrom NT 2024, value: 3180, unit: kWh, tolerance: 0 }
      - { label: Heizstrom NT 2025, value: 3420, unit: kWh, tolerance: 0 }
    sources:
      - { file: 01_electricity_suedvolt/04_Strom_Jahresabrechnung_2024_SuedVolt.pdf, page: 1 }
      - { file: 01_electricity_suedvolt/06_Strom_Jahresabrechnung_2025_SuedVolt.pdf, page: 1 }
      - { file: 01_electricity_suedvolt/32_Heizstrom_Jahresabrechnung_2024_SuedVolt.pdf, page: 1 }
      - { file: 01_electricity_suedvolt/34_Heizstrom_Jahresabrechnung_2025_SuedVolt.pdf, page: 1 }
    expected_tools: [make_chart]
    expected_artifact: chart
    tests: Grafik auf Anfrage, Werte aus Zählerständen

  - id: V2
    category: visual
    question: Gib mir eine Übersicht über alle Kosten 2025.
    expected_answer: Lichtstrom 1.379,30 EUR, Heizstrom 1.257,82 EUR, Gas 1.555,43 EUR, Wasser 459,10 EUR, Betriebskosten (Anteil) 1.830,00 EUR.
    facts:
      - { label: Lichtstrom 2025, value: 1379.30, unit: EUR }
      - { label: Heizstrom 2025, value: 1257.82, unit: EUR }
      - { label: Gas 2025, value: 1555.43, unit: EUR }
      - { label: Wasser 2025, value: 459.10, unit: EUR }
      - { label: Betriebskosten 2025, value: 1830.00, unit: EUR }
    sources:
      - { file: 01_electricity_suedvolt/06_Strom_Jahresabrechnung_2025_SuedVolt.pdf, page: 1 }
      - { file: 01_electricity_suedvolt/34_Heizstrom_Jahresabrechnung_2025_SuedVolt.pdf, page: 1 }
      - { file: 02_gas_neckarenergie/10_Gas_Jahresabrechnung_2025_NeckarEnergie.pdf, page: 1 }
      - { file: 03_water_stadtwerke_mosbach/15_Wasser_Jahresbescheid_2025_SWM.pdf, page: 1 }
      - { file: 04_housing_utilities_contractors/19_Nebenkostenabrechnung_2025_Hausverwaltung.pdf, page: 1 }
    expected_tools: [make_overview]
    expected_artifact: table
    tests: Übersicht über alle Sparten

  - id: V3
    category: visual
    question: Wie haben sich die Gaspreise seit 2024 entwickelt? Zeig das als Grafik.
    expected_answer: Arbeitspreis 10,80 ct/kWh (2024–2025), ab 01.01.2026 9,95 ct/kWh; Grundpreis 14,50 EUR/Monat, ab 01.01.2026 16,00 EUR/Monat.
    facts:
      - { label: Arbeitspreis bis 2025, value: 10.80, unit: ct/kWh }
      - { label: Arbeitspreis ab 2026, value: 9.95, unit: ct/kWh }
      - { label: Grundpreis ab 2026, value: 16.00, unit: EUR/Monat }
    sources:
      - { file: 02_gas_neckarenergie/07_Gas_Liefervertrag_NeckarEnergie_2024.pdf, page: 1 }
      - { file: 02_gas_neckarenergie/09_Gas_Preisanpassung_NeckarEnergie_2026.pdf, page: 1 }
    expected_tools: [make_chart]
    expected_artifact: chart
    tests: Preisverlauf als Grafik

