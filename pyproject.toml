[project]
name = "local-household-audit-agent"
version = "0.1.0"
description = "Local agentic RAG prototype for auditing household energy and utility documents"
requires-python = ">=3.13"
dependencies = [
    "diskcache>=5.6.3",
    "ollama>=0.4",
    "pydantic>=2.8",
    "pymupdf>=1.24",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/audit_agent"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]

[tool.ruff.lint.per-file-ignores]
# HTML templates with long lines
"scripts/generate_error_documents.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "slow: tests that need a running Ollama service or take long (excluded from the quality gate)",
]
